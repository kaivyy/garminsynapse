[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garminsynapse"
version = "0.4.2"
description = "Garmin Synapse — Unified Garmin Connect engine, MCP server, and health dashboard."
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "click",
    "requests",
    "garminconnect",
    "curl_cffi",
    "sqlalchemy",
    "mcp",
    "playwright",
    "fitdecode",
    "defusedxml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
garminsynapse = "garminsynapse.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
